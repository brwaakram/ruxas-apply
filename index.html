<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>فۆڕمی داواکاریی کار — ڕوخاس</title>

<style>
@font-face{font-family:'RX Arabic';font-weight:400;font-style:normal;font-display:swap;src:url(NRT-Regular.ttf) format('truetype');}
@font-face{font-family:'RX Arabic';font-weight:700;font-style:normal;font-display:swap;src:url(NRT-Bold.ttf) format('truetype');}
</style>
<style>
  /* RUXAS tokens (studio/src/tokens.css) */
  :root {
    --red: #CF2727; --red-700: #991B1B; --red-tint: #FEF2F2;
    --charcoal: #111827; --ink: #030712; --muted: #6B7280; --border: #E5E7EB; --offwhite: #F9FAFB;
    --success: #10B981; --error: #EF4444;
    --stack: 'RX Arabic', 'Noto Sans Arabic', system-ui, sans-serif;
    --r-lg: 16px; --r-md: 12px; --r-sm: 8px;
  }
  * { box-sizing: border-box; }
  html { font-family: var(--stack); }
  body { margin: 0; background: var(--offwhite); color: var(--charcoal); font-size: 16px; line-height: 1.7; direction: rtl; text-align: right; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }

  header.head { display: flex; align-items: center; gap: 14px; padding: 8px 0 14px; }
  .logo { width: 56px; height: 56px; flex: none; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.3; }
  .brand-line { color: var(--muted); font-size: 14px; }
  .num { direction: ltr; unicode-bidi: isolate; }
  .bar { height: 4px; background: var(--red); border-radius: 2px; margin-bottom: 14px; }
  .intro { margin: 0 0 16px; color: var(--charcoal); }
  .req { color: var(--red); }
  .opt { color: var(--muted); font-weight: 400; font-size: 13px; }

  section.card.about { border-color: var(--red); background: var(--red-tint); }
  .card.about h2 { border-bottom: 0; padding-bottom: 0; margin-bottom: 6px; }
  .card.about h2:not(:first-child) { margin-top: 14px; }
  .about ul { margin: 0; padding: 0 20px 0 0; }
  .about p { margin: 0; }

  section.card { background: #fff; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px; margin-bottom: 14px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; font-weight: 700; color: var(--red-700); padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .fields { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 560px) { .fields { grid-template-columns: 1fr 1fr; } .field.wide { grid-column: 1 / -1; } }

  .field label.k, .field .k { display: block; font-weight: 700; font-size: 15px; margin-bottom: 6px; color: var(--ink); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  input[type=text], input[type=tel], input[type=date] {
    width: 100%; font: inherit; color: var(--charcoal); background: #fff;
    border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; min-height: 46px;
  }
  input[type=date], input[inputmode=numeric], input[type=tel] { direction: ltr; text-align: left; }
  input:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: var(--red); }
  input[type=file] { width: 100%; font: inherit; font-size: 14px; color: var(--charcoal); background: #fff;
    border: 1px dashed var(--border); border-radius: var(--r-sm); padding: 10px 12px; min-height: 46px; }
  .field.skipped { display: none; }
  label.none { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-weight: 700; cursor: pointer; min-height: 44px; }
  label.none input { width: 22px; height: 22px; accent-color: var(--red); flex: none; margin: 0; }

  /* Unfilled required fields after a submit attempt */
  .field.invalid input[type=text], .field.invalid input[type=tel], .field.invalid input[type=date], .field.invalid input[type=file] {
    border-color: var(--error); box-shadow: 0 0 0 1px var(--error); background: var(--red-tint); }
  .field.invalid .pills { border-color: var(--error); box-shadow: 0 0 0 1px var(--error); background: var(--red-tint); }
  .field.invalid label.k, .field.invalid .k { color: var(--error); }
  .grid tr.invalid td { background: var(--red-tint); color: var(--error); }
  .grid tr.invalid td:first-child { box-shadow: inset -3px 0 0 var(--error); }
  .err { display: none; color: var(--error); font-size: 13px; margin-top: 4px; }
  .field.invalid .err { display: block; }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; border: 1px solid transparent; border-radius: var(--r-md); padding: 4px; margin: -4px; }
  .pill { position: relative; }
  .pill input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .pill span { display: inline-block; padding: 9px 16px; border: 1px solid var(--border); border-radius: 999px; background: #fff; min-height: 44px; line-height: 24px; }
  .pill input:checked + span { background: var(--red-tint); border-color: var(--red); color: var(--red-700); font-weight: 700; }
  .pill input:focus-visible + span { outline: 2px solid var(--red); outline-offset: 1px; }

  table.grid { width: 100%; border-collapse: collapse; }
  .grid th, .grid td { padding: 10px 6px; border-bottom: 1px solid var(--border); text-align: center; }
  .grid th:first-child, .grid td:first-child { text-align: right; font-weight: 700; }
  .grid thead th { color: var(--muted); font-weight: 700; font-size: 14px; }
  .grid input[type=radio] { width: 22px; height: 22px; accent-color: var(--red); cursor: pointer; }

  .actions { margin-top: 8px; }
  button.submit { width: 100%; font: inherit; font-weight: 700; font-size: 18px; color: #fff; background: var(--red);
    border: 0; border-radius: var(--r-md); padding: 14px; min-height: 52px; cursor: pointer; }
  button.submit:disabled { opacity: .6; cursor: default; }
  .fail { display: none; margin-top: 12px; font-weight: 700; padding: 12px 14px; background: #FEF2F2; border: 1px solid var(--error); border-radius: var(--r-sm); color: var(--red-700); }

  .done { display: none; text-align: center; padding: 48px 16px; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--success); color: #fff; font-size: 36px; line-height: 64px; margin: 0 auto 16px; }
  .done h2 { margin: 0 0 6px; color: var(--ink); }
  .done p { margin: 0; color: var(--muted); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  footer.foot { text-align: center; color: var(--muted); font-size: 13px; margin-top: 24px; }
</style>
</head>

  }

  }
  function choiceField(f) {

  }
